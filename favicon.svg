<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="0%" r="100%">
      <stop offset="0%" stop-color="#151a45"/>
      <stop offset="70%" stop-color="#0d1030"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="rgba(255,255,255,0.05)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.15)"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="rgba(255,255,255,0.55)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
    <clipPath id="tubeClip">
      <rect x="196" y="120" width="120" height="300" rx="60"/>
    </clipPath>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- bottle body -->
  <g>
    <rect x="196" y="120" width="120" height="300" rx="60" fill="url(#glass)" stroke="#f4f6ff" stroke-width="7"/>
    <g clip-path="url(#tubeClip)">
      <rect x="196" y="330" width="120" height="90" fill="#e11d48"/>
      <rect x="196" y="270" width="120" height="60" fill="#facc15"/>
      <rect x="196" y="210" width="120" height="60" fill="#22d3ee"/>
      <rect x="196" y="150" width="120" height="60" fill="#a855f7"/>
    </g>
    <!-- rim -->
    <rect x="186" y="104" width="140" height="30" rx="15" fill="none" stroke="#f4f6ff" stroke-width="8"/>
    <!-- glossy highlight -->
    <rect x="212" y="140" width="18" height="260" rx="9" fill="url(#shine)"/>
  </g>
</svg>
