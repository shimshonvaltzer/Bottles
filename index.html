<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>מיון בקבוקים</title>
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="favicon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<meta name="theme-color" content="#0d1030" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="header">
    <div class="hdr-main">
      <div class="level-pill">
        <span class="lv-label">שלב</span>
        <span id="stat-level" class="lv-num">1</span>
        <div class="level-progress"><div id="level-progress-fill" class="level-progress-fill"></div></div>
      </div>
      <h1 class="title">מיון בקבוקים</h1>
      <div class="header-toggles">
        <button id="btn-stats" class="icon-btn" title="סטטיסטיקות" aria-label="סטטיסטיקות"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V11M12 20V4M19 20v-6"/></svg></button>
        <button id="btn-mute" class="icon-btn" title="השתקה / ביטול השתקה" aria-label="השתקה" aria-pressed="false"><svg class="ico ico-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M16 9a4.5 4.5 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/></svg><svg class="ico ico-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M16.5 9.5l5 5M21.5 9.5l-5 5"/></svg></button>
        <button id="btn-colorblind" class="icon-btn" title="סמלים לעיוורי צבעים" aria-label="סמלים לעיוורי צבעים" aria-pressed="false"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
        <button id="btn-install" class="icon-btn" title="התקן אפליקציה" aria-label="התקן אפליקציה" hidden><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></svg></button>
      </div>
    </div>
    <div class="stats">
      <div class="stat"><span class="stat-label">ניקוד</span><span id="stat-score" class="stat-value">0</span></div>
      <div class="stat"><span class="stat-label">מהלכים</span><span id="stat-moves" class="stat-value">0</span></div>
      <div class="stat"><span class="stat-label">שיא</span><span id="stat-best" class="stat-value">0</span></div>
    </div>
  </header>

  <main class="main">
    <div id="stuck-banner" class="stuck-banner" hidden>
      אין מהלכים אפשריים! נסו <strong>ביטול מהלך</strong> או <strong>התחלה מחדש</strong>.
    </div>
    <div id="lock-note" class="lock-note" hidden></div>
    <div id="board" class="board"></div>
  </main>

  <footer class="controls">
    <button id="btn-undo" class="ctrl-btn" aria-label="ביטול מהלך">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
      <span class="ctrl-text">ביטול מהלך</span>
      <span class="ctrl-count" id="undo-count">5</span>
    </button>
    <button id="btn-restart" class="ctrl-btn" aria-label="התחלה מחדש">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v4.5h-4.5"/></svg>
      <span class="ctrl-text">התחלה מחדש</span>
    </button>
    <button id="btn-add" class="ctrl-btn" aria-label="הוסף בקבוק">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      <span class="ctrl-text">הוסף בקבוק</span>
      <span class="ctrl-count" id="add-count">2</span>
    </button>
    <button id="btn-hint" class="ctrl-btn" aria-label="רמז">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 18h5M10 21h4M12 3a6 6 0 0 0-3.6 10.8c.6.5 1 1.2 1 2.2h5.2c0-1 .4-1.7 1-2.2A6 6 0 0 0 12 3z"/></svg>
      <span class="ctrl-text">רמז</span>
      <span class="ctrl-count" id="hint-count">3</span>
    </button>
  </footer>

  <div id="stats-overlay" class="stats-overlay" hidden>
    <div class="stats-card">
      <button id="btn-stats-close" class="overlay-close" aria-label="סגור"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      <h2>סטטיסטיקות</h2>
      <div class="stats-grid">
        <div class="stats-item"><span class="stats-num" id="s-levels">0</span><span class="stats-lbl">שלבים שהושלמו</span></div>
        <div class="stats-item"><span class="stats-num" id="s-moves">0</span><span class="stats-lbl">סה"כ מהלכים</span></div>
        <div class="stats-item"><span class="stats-num" id="s-hints">0</span><span class="stats-lbl">רמזים בשימוש</span></div>
        <div class="stats-item"><span class="stats-num" id="s-undos">0</span><span class="stats-lbl">ביטולים בשימוש</span></div>
        <div class="stats-item"><span class="stats-num" id="s-streak">0</span><span class="stats-lbl">רצף נוכחי</span></div>
        <div class="stats-item"><span class="stats-num" id="s-best-streak">0</span><span class="stats-lbl">רצף שיא</span></div>
      </div>
    </div>
  </div>

  <div id="win-overlay" class="win-overlay" hidden>
    <canvas id="confetti-canvas" class="confetti-canvas"></canvas>
    <div class="win-card">
      <h2>כל הכבוד!</h2>
      <div id="win-stars" class="win-stars">★★★</div>
      <div id="win-score" class="win-score">+100 נקודות</div>
      <div id="win-total" class="win-total">סה"כ: 0</div>
      <button id="btn-next" class="btn-primary">השלב הבא ←</button>
    </div>
  </div>

  <script src="game.js"></script>
  <script>
    (function () {
      // Register the service worker with a relative path so it works both
      // locally (including file://, where it silently fails) and on
      // GitHub Pages project subpaths.
      if ('serviceWorker' in navigator) {
        try {
          window.addEventListener('load', function () {
            navigator.serviceWorker.register('sw.js').catch(function () {});
          });
        } catch (e) {}
      }

      // Install prompt handling.
      var deferredPrompt = null;
      var installBtn = document.getElementById('btn-install');

      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        deferredPrompt = e;
        if (installBtn) installBtn.hidden = false;
      });

      if (installBtn) {
        installBtn.addEventListener('click', function () {
          if (!deferredPrompt) return;
          deferredPrompt.prompt();
          deferredPrompt.userChoice
            .finally(function () {
              deferredPrompt = null;
              installBtn.hidden = true;
            });
        });
      }

      window.addEventListener('appinstalled', function () {
        deferredPrompt = null;
        if (installBtn) installBtn.hidden = true;
      });
    })();
  </script>
</body>
</html>
